name: Build iOS .ipa (signed, on demand)

# Produces a signed iOS .ipa via GitHub macOS runners — no MacBook needed.
# Runs on manual trigger (workflow_dispatch) or when a version tag is pushed.
#
# REQUIREMENTS before an installable .ipa can be produced:
#   1. Add repo secrets (Settings → Secrets and variables → Actions):
#        APPLE_CERT_BASE64     — distribution cert (.p12) base64
#        APPLE_CERT_PASSWORD   — cert password
#        APPLE_PROFILE_BASE64  — provisioning profile (.mobileprovision) base64
#        APPLE_TEAM_ID         — Apple Developer team id
#   2. The XcodeGen project (ios/project.yml) builds the app shell
#      (Life Mode + Connectome Mode stubs) + FlyBrainCore framework.
#   3. Run the workflow manually; download the .ipa artifact and install
#      with a Mac/Apple Configurator/AltStore, or distribute via TestFlight.

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        type: choice
        default: 'Release'
        options: [Debug, Release]
      signing:
        description: 'Code-sign for device? (req. secrets)'
        type: boolean
        default: true
  push:
    tags: ['v*']

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen || true
          xcodegen --version

      - name: Decode signing assets
        if: github.event.inputs.signing != 'false' && env.APPLE_CERT_BASE64 != ''
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
        run: |
          echo "$APPLE_CERT_BASE64" | base64 --decode > /tmp/cert.p12
          echo "$APPLE_PROFILE_BASE64" | base64 --decode > /tmp/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "${{ secrets.APPLE_CERT_PASSWORD }}" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temp build.keychain

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Build .ipa (simulator, unsigned) — always
        working-directory: ios
        run: |
          xcodebuild -project FlyBrainPet.xcodeproj -scheme FlyBrainPet \
            -configuration ${{ github.event.inputs.configuration || 'Release' }} \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData build CODE_SIGNING_ALLOWED=NO

      - name: Build device .ipa (signed)
        if: github.event.inputs.signing != 'false' && env.APPLE_CERT_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        working-directory: ios
        run: |
          xcodebuild -project FlyBrainPet.xcodeproj -scheme FlyBrainPet \
            -configuration ${{ github.event.inputs.configuration || 'Release' }} \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedDataDevice \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            build
          # assemble .ipa
          APP_PATH=$(find build/DerivedDataDevice/Build/Products -name '*.app' | head -1)
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -qry FlyBrainPet.ipa Payload

      - name: Build device .app (unsigned, arm64 — sideloadable)
        # Produces a real arm64 DEVICE build with signing switched off. This is
        # NOT installable as-is: AltStore / Sideloadly must re-sign it with the
        # user's own Apple ID. It exists because the signed path above needs a
        # paid certificate that the repo may not have, and an unsigned device
        # build is the only artifact a free Apple ID can actually install.
        #
        # Named `...-device` and kept SEPARATE from the simulator build, so the
        # two are never confused: a simulator .app cannot run on a phone at all,
        # and shipping one under a name that says `.ipa` looks installable while
        # being inert.
        working-directory: ios
        run: |
          xcodebuild -project FlyBrainPet.xcodeproj -scheme FlyBrainPet \
            -configuration ${{ github.event.inputs.configuration || 'Release' }} \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedDataDeviceUnsigned \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" build
          APP_PATH=$(find build/DerivedDataDeviceUnsigned/Build/Products -name '*.app' | head -1)
          mkdir -p build/unsigned/Payload
          cp -R "$APP_PATH" build/unsigned/Payload/
          cd build/unsigned && zip -qry FlyBrainPet-unsigned-device.ipa Payload
          echo "built: $(du -h FlyBrainPet-unsigned-device.ipa | cut -f1)"

      - name: Upload download artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FlyBrainPet-downloads
          path: |
            ios/build/FlyBrainPet.ipa
            ios/build/unsigned/FlyBrainPet-unsigned-device.ipa
          if-no-files-found: warn

      - name: Upload simulator build (NOT installable on a device)
        uses: actions/upload-artifact@v4
        with:
          name: FlyBrainPet-simulator-only
          path: ios/build/DerivedData/Build/Products/Release-iphonesimulator/*.app
          if-no-files-found: warn