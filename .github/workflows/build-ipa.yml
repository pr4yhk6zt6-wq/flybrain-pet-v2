name: Build iOS .ipa (signed, on demand)

# NOTE: This workflow produces a signed .ipa for device install (iPhone 11+).
# It runs when triggered manually (workflow_dispatch) or when a release tag
# is pushed — NOT on every push, to avoid burning macOS runner minutes.
#
# REQUIREMENTS before this can produce an installable .ipa:
#   1. The Xcode app shell exists (Phase 9-10: Life Mode + Connectome Mode
#      Metal renderer + app bundle). Until then the engine compiles but there
#      is no app to sign — the workflow still runs the build+test stage and
#      reports status.
#   2. Add repo secrets (Settings → Secrets and variables → Actions):
#        APPLE_CERT_BASE64      — distribution cert (.p12) base64
#        APPLE_CERT_PASSWORD    — cert password
#        APPLE_PROFILE_BASE64   — provisioning profile (.mobileprovision) base64
#        APPLE_TEAM_ID          — your Apple Developer team id
#        APPLE_BUNDLE_ID        — e.g. com.yourname.flybrainpet
#   3. (No MacBook needed — GitHub macOS runners do the signing.)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        type: choice
        default: 'Release'
        options: [Debug, Release]
  push:
    tags: ['v*']

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Decode signing cert + profile
        if: env.APPLE_CERT_BASE64 != ''
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
        run: |
          echo "$APPLE_CERT_BASE64" | base64 --decode > /tmp/cert.p12
          echo "$APPLE_PROFILE_BASE64" | base64 --decode > /tmp/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Import signing certificate
        if: env.APPLE_CERT_PASSWORD != ''
        env:
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temp build.keychain

      - name: Swift core tests (sanity before packaging)
        run: cd ios && swift build && swift test

      # ---- app shell build (Phase 9-10). Until the Xcode project exists,
      # this stage validates that the core compiles for a real iOS device
      # and assembles a minimal unsigned .ipa for simulator testing.
      - name: Build core for iOS device SDK
        run: |
          cd ios
          xcrun --sdk iphoneos swiftc -parse-as-library -target arm64-apple-ios16.0 \
            Sources/FlyBrainCore/*.swift -emit-library -o /tmp/libFlyBrainCore.a

      - name: Create Payload + unsigned .ipa (fallback app placeholder)
        run: |
          mkdir -p build/Payload
          cat > build/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>FlyBrainPet</string>
            <key>CFBundleIdentifier</key><string>com.flybrain.pet</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>CFBundleExecutable</key><string>FlyBrainPet</string>
            <key>MinimumOSVersion</key><string>16.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer></array>
            <key>UILaunchScreen</key><dict/>
          </dict>
          </plist>
          EOF

      - name: Sign (when secrets present)
        if: env.APPLE_CERT_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "Signing with team $APPLE_TEAM_ID (placeholder — real app shell in Phase 9-10)"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlyBrainPet-ipa
          path: build/Payload/
          if-no-files-found: ignore