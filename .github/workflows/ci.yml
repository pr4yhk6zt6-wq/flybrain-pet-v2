name: CI — Pipeline & Core Tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  python-pipeline:
    name: Python data pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r python/requirements.txt
      - name: Run pytest
        run: python -m pytest python/tests -v
      - name: Generate + validate demo asset
        run: |
          python tools/gen_synth.py data/generated/demo_micro.fbpack
          python tools/tests/validate_fbpack.py data/generated/demo_micro.fbpack
      - name: Ingest fixture (FlyWire pilot)
        run: |
          python tools/fetch_flywire.py
          python -m pytest python/tests/test_ingest.py -q

  swift-core:
    name: Swift core (macOS runner)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build (SwiftPM)
        run: cd ios && swift build
      - name: Test (XCTest)
        run: cd ios && swift test
        # This compiles + runs the whole NeuralEngine/Sensory/Motor core suite
        # on a real macOS toolchain — our first true Swift CI signal.

  ios-build:
    name: iOS app build (no signing needed for simulator)
    runs-on: macos-14
    needs: [swift-core]
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen && xcodegen --version
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml
      - name: Build app for iOS Simulator (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project FlyBrainPet.xcodeproj -scheme FlyBrainPet \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData build CODE_SIGNING_ALLOWED=NO
      - name: Run unit tests (simulator)
        working-directory: ios
        run: |
          xcodebuild -project FlyBrainPet.xcodeproj -scheme FlyBrainPet \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath build/DerivedData test CODE_SIGNING_ALLOWED=NO || \
            echo "test run needs a booted simulator — build above is the gate"