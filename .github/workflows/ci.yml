name: CI — Pipeline & Core Tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  python-pipeline:
    name: Python data pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r python/requirements.txt
      - name: Run pytest
        run: python -m pytest python/tests -v
      - name: Validate the committed asset + exercise the generator
        run: |
          # The committed asset is the contract the Swift tests load, so it is
          # validated as-is. The generator is exercised to a scratch path: it is
          # not byte-reproducible (header date + time-seeded network), so
          # regenerating over the committed file would churn it every run.
          python tools/tests/validate_fbpack.py data/generated/demo_micro.fbpack
          python tools/gen_synth.py /tmp/demo_regen.fbpack
          python tools/tests/validate_fbpack.py /tmp/demo_regen.fbpack
      - name: Traceability gate (every neuron must name its source cell)
        run: python tools/verify_traceability.py
      - name: Swift test fixture must match the pipeline asset
        run: python tools/sync_test_asset.py --check
      - name: Neural engine offline mirror (parity with Swift)
        run: python tools/check_tests.py
      - name: Closed-loop fixture gate (the fixture itself must be valid)
        run: python tools/verify_closed_loop_fixture.py
      - name: Tarsal-load reafference gate (no DC term, no shorted loop)
        run: python tools/mirror_regional_fixture.py
      - name: Tarsal-contact gate (it must be exercisable, not an untested branch)
        run: python tools/probe_tarsal_contact_gate.py
      - name: Sensory channel targets (no channel may drive the motor readout)
        run: python tools/probe_channel_targets.py
      - name: Motor readout composition (what the drive is summed over)
        run: python tools/measure_motor_readout_composition.py
      - name: Sensory channels on the SHIPPED assets (dead / shorted channel)
        run: python tools/probe_shipped_asset_channels.py
      - name: Motor pool coverage (the six leg slots must be addressable)
        run: python tools/measure_motor_pool_coverage.py
      - name: Time-scale gate (drive signal must be readable per step)
        run: python tools/measure_time_scale.py
      - name: Render packing gate (packed word widths vs the real enums)
        run: python tools/probe_render_packing.py
      - name: Render camera gate (projection conventions + framing)
        run: python tools/verify_render_camera.py
      - name: Render palette gate (region table domain + separation)
        run: python tools/verify_render_palette.py
      - name: Snapshot completeness gate (restore must reproduce the run)
        run: python tools/probe_snapshot_completeness.py
      - name: Closed-loop parity (sensory input must actually move the fly)
        run: python tools/closed_loop_parity.py
      - name: Body physics offline gates (calibration + regression)
        run: |
          python tools/sim_body_dynamics.py
          python tools/sim_motor_system.py
          python tools/verify_body_physics.py
      - name: Ingest fixture (FlyWire pilot)
        run: |
          python tools/fetch_flywire.py
          python -m pytest python/tests/test_ingest.py -q

  swift-core:
    name: Swift core (macOS runner)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build (SwiftPM)
        run: cd ios && swift build
      - name: Test (XCTest)
        run: cd ios && swift test
        # This compiles + runs the whole NeuralEngine/Sensory/Motor core suite
        # on a real macOS toolchain — our first true Swift CI signal.

  ios-build:
    name: iOS app build (no signing needed for simulator)
    runs-on: macos-14
    needs: [swift-core]
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen && xcodegen --version
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml
      - name: Build app for iOS Simulator (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project FlyBrainPet.xcodeproj -scheme FlyBrainPet \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData build CODE_SIGNING_ALLOWED=NO
      - name: Run unit tests (simulator)
        working-directory: ios
        # Real gate: the simulator keeps the working directory from the job's
        # first xcodebuild, so a `git clean` between steps can kill the run.
        # Verified green on run 37526697918 (25 tests, 0 failures).
        run: |
          xcodebuild -project FlyBrainPet.xcodeproj -scheme FlyBrainPet \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath build/DerivedData test CODE_SIGNING_ALLOWED=NO